# Copy this file unchanged. The checks live in selfxyz/compliance.
# Optional: .github/compliance.json, to correct what was detected or to block on findings.
name: compliance

on:
  pull_request: # every PR; only workspaces whose dependency files changed are scanned
  push:
    branches: [main, master, dev, staging] # the default branch, whichever of these it is
  schedule:
    - cron: "17 5 * * 1" # Mondays: full scan, the monitoring record
  workflow_dispatch: # manual "Run workflow" button
    inputs:
      full:
        description: Scan every workspace
        type: boolean
        default: true

permissions:
  contents: read
  vulnerability-alerts: read # to check that Dependabot alerts are on

concurrency:
  group: compliance-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compliance:
    uses: selfxyz/compliance/.github/workflows/compliance.yml@v1
    with:
      full: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
